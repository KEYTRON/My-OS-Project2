name: Kernel smoke test

on:
  push:
    branches: [ main ]
  pull_request:

jobs:
  qemu-smoke:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential nasm xorriso grub-pc-bin grub-common qemu-system-x86 mtools

      - name: Install Rust bare-metal target
        run: |
          rustup target add x86_64-unknown-none

      - name: Build x86_64 ISO (QEMU exit enabled)
        run: |
          set -euo pipefail
          QEMU_EXIT=1 ./utils/build_iso.sh
          ls -l kernel/myos.iso

      - name: Verify multiboot header
        run: |
          grub-file --is-x86-multiboot kernel/build/kernel-x86_64.bin

      - name: Boot under QEMU
        run: |
          set -euo pipefail
          status=0
          timeout 60s qemu-system-x86_64 \
            -cdrom kernel/myos.iso \
            -m 256 \
            -display none \
            -serial stdio \
            -no-reboot \
            -no-shutdown \
            -device isa-debug-exit,iobase=0xf4,iosize=0x04 \
            > qemu.log 2>&1 || status=$?
          # isa-debug-exit с кодом 0 завершает QEMU со статусом 1
          if [ "$status" -ne 0 ] && [ "$status" -ne 1 ]; then
            cat qemu.log
            exit $status
          fi
          tail -n 30 qemu.log
          # Ядро сигналит выход только ПОСЛЕ полной инициализации
          # (GDT, IDT, C++ куча, таймер, клавиатура, Rust selftest)
          grep -q "Rust runtime selftest: OK" qemu.log
          grep -q "Kernel init complete." qemu.log
          echo "Smoke test passed: kernel initialized all subsystems."
